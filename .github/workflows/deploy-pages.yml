name: Deploy Sanavera Retro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site for GitHub Pages
        run: npm run build:pages

      - name: Verify pages-dist contents
        run: |
          echo "Contents of pages-dist:"
          ls -la pages-dist/
          test -f pages-dist/index.html || (echo "ERROR: index.html missing" && exit 1)
          test -f pages-dist/player.html || (echo "ERROR: player.html missing" && exit 1)
          test -f pages-dist/logo.jpg || (echo "ERROR: logo.jpg missing" && exit 1)
          test -f pages-dist/favicon.svg || (echo "ERROR: favicon.svg missing" && exit 1)
          echo "Verification passed."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
